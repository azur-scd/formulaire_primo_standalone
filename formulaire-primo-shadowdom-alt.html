<!--
Formulaire de recherche avancée déporté pour Primo BO adapté aux spécificités UniCA
Version 1.7 (présentation alternative : Critères de recherche / Filtres empilés), 21/10/2026

Ce formulaire utilise la technique du Shadow DOM : son HTML et son CSS sont isolés dans un "shadow root" rattaché à l'élément #primo-form-host, ce qui évite tout conflit de styles avec la page qui l'intègre.
Pour cette raison, le JS cherche les éléments dans ce shadow root (root.getElementById, root.querySelector) et non dans document.

Code personnalisable en modifiant ces variables au début de la balise <script>: 
  const code_bibliotheque = ''; => si défini, donne la possibilité de chercher dans une bibliothèque spécifique. indiquer un code de bibliothèque défini dans Primo
  const label_bibliotheque = ''; => indiquer un nom de bibliothèque (peut être différent du nom défini dans Primo)
  const toutes_bibliotheques = true; => si true, donne la possibilité de chercher dans toutes les bibliothèques du réseau

Accessibilité : un lien d'évitement (« Passer le formulaire de recherche dans le catalogue »), visible au focus clavier, permet de sauter le formulaire.
Il s'appuie sur un repère vide (id = id du conteneur + "-fin") inséré par le script juste après #primo-form-host.

Génération dynamique de 2 à 7 lignes de recherche.

Champs disponibles :
> Tous les champs
> Titre
> Auteur/créateur
> Sujet
> Éditeur (lsr01)
> Collection (lsr02)
> ISBN/ISSN/EAN/PPN/NNT/DOI (lsr03)
> Cote et code-barre (lsr07)

Opérateurs de correspondance entre la chaine cherchée et les index Primo :
> contient
> est égal à
> commence par

Opérateurs booléens pour articuler différentes lignes de recherche :  
> ET (AND)
> OU (OR)
> SAUF (NOT)

Fieldset "Critères de recherche" (support et type de document, puis lignes de recherche) :
> Support
> Type de document
> Lignes de recherche (champ, correspondance, expression)

Fieldset "Filtres optionnels (date et langue)" (replié par défaut sur petit écran) :
> Date de publication
> Langue

Pour le support :
> Physique (une bibliothèque) ⇒ facet=library,include,code_bibliotheque
> Physique (toutes les bibliothèques) ⇒ facet=tlevel,include,available
> En ligne ⇒ facet=tlevel,include,online_resources

Paramètres Primo par défaut :
> tab=default_tab
> search_scope=all
> vid=UCA
> lang=fr_FR
> mode=advanced
> offset=0

La recherche ouvre le résultat dans un nouvel onglet (window.open(..., '_blank')).

Points d’attention pour l’intégration
> Les polices de la page hôte sont héritées (font-family: inherit), mais ses autres styles (couleurs, box-sizing, etc.) ne s’appliquent pas au formulaire. Si le rendu est un peu différent, ajoute les règles qui manquent dans le bloc <style> du template.
> Pour intégrer plusieurs formulaires sur la même page, il faudra changer l’id primo-form-host pour chacun.
> Penser à tester le comportement du window.open dans le CMS cible, certains bloquent les pop-ups tant que l’ouverture ne découle pas directement d’un clic, ce qui est bien le cas ici.
> Pour tester la responsivité le code est intégré dans une balise <html>, mais pour l'intégration seul le <div id=primo-form-host> et le <script> doivent être copiés

-->

    // Liste des opérateurs de recherche proposés à l'usager.

    // Chaque "value" correspond au code attendu par l'URL Primo, chaque "label" correspond au texte affiché à l'écran.
    const matchOperators = [
        { value: 'contains', label: 'contient' },
        { value: 'exact', label: 'est égal à' },

    ];
    // Liste des opérateurs booléens qui relient les lignes entre elles.
    // Important : le premier critère n'affiche pas de booléen,

    const boolOperators = [

        { value: 'OR', label: 'OU' },

        endYearInput.addEventListener('blur', resetYearsPlaceholders);
    }

    // Initialisation au chargement de la page.
    // 1) on crée les deux premières lignes
    // 2) on applique la logique de compatibilité des types de documents
    // 3) on met à jour le libellé de l'option "Physique" si une bibliothèque est définie dans le code, on masque l'option "Physique" si aucune bibliothèque n'est définie dans le code
    // 4) on met à jour les champs années personnalisées
    // 5) on écoute les évenements entrainant une modification des champs années personnalisés
    initializeForm();
    updateDocumentTypes();
    updatedocumentTypes();
    updateLibrarySupport();
    updatePublicationDateFieldVisibility();
    setupPublicationDateFilter();
})();
