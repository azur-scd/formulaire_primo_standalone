<!--
Formulaire de recherche avancée déporté pour Primo BO adapté aux spécificités UniCA
Version 1.4, 20/10/2026

Ce formulaire utilise la technique du Shadow DOM : son HTML et son CSS sont isolés dans un "shadow root" rattaché à l'élément #primo-form-host, ce qui évite tout conflit de styles avec la page qui l'intègre.
Pour cette raison, le JS cherche les éléments dans ce shadow root (root.getElementById, root.querySelector) et non dans document.

Code personnalisable en modifiant ces variables au début de la balise <script>: 
  const code_bibliotheque = ''; => si défini, donne la possibilité de chercher dans une bibliothèque spécifique. indiquer un code de bibliothèque défini dans Primo
  const label_bibliotheque = ''; => indiquer un nom de bibliothèque (peut être différent du nom défini dans Primo)
  const toutes_bibliotheques = true; => si true, donne la possibilité de chercher dans toutes les bibliothèques du réseau

Génération dynamique de 2 à 7 lignes de recherche.

Champs disponibles :
> Tous les champs
> Titre
> Auteur/créateur
> Sujet
> Éditeur (lsr01)
> Collection (lsr02)
> ISBN/ISSN/EAN/PPN/NNT/DOI (lsr03)
> Cote et code-barre (lsr07)

Opérateurs de correspondance entre la chaine cherchée et les index Primo :
> contient
> est égal à
> commence par

Opérateurs booléens pour articuler différentes lignes de recherche :  
> ET (AND)
> OU (OR)
> SAUF (NOT)

Filtres latéraux :
> Support
> Type de document
> Langue
> Date de publication

Pour le support :
> Physique (une bibliothèque) ⇒ facet=library,include,code_bibliotheque
> Physique (toutes les bibliothèques) ⇒ facet=tlevel,include,available
> En ligne ⇒ facet=tlevel,include,online_resources

Paramètres Primo par défaut :
> tab=default_tab
> search_scope=all
> vid=UCA
> lang=fr_FR
> mode=advanced
> offset=0

La recherche ouvre le résultat dans un nouvel onglet (window.open(..., '_blank')).

Points d’attention pour l’intégration
> Les polices de la page hôte sont héritées (font-family: inherit), mais ses autres styles (couleurs, box-sizing, etc.) ne s’appliquent pas au formulaire. Si le rendu est un peu différent, ajoute les règles qui manquent dans le bloc <style> du template.
> Pour intégrer plusieurs formulaires sur la même page, il faudra changer l’id primo-form-host pour chacun.
> Penser à tester le comportement du window.open dans le CMS cible, certains bloquent les pop-ups tant que l’ouverture ne découle pas directement d’un clic, ce qui est bien le cas ici.
-->
<div id="primo-form-host"></div>

    const max_rows = 7;

        search_scope: 'all',

        offset: '0'
    };
    // Liste des champs interrogeables dans Primo.

        { value: 'title', label: 'Titre' },
        { value: 'creator', label: 'Auteur/créateur' },
        { value: 'sub', label: 'Sujet' },

        { value: 'lsr02', label: 'Collection' },

    // Liste des opérateurs de recherche proposés à l'usager.

    // Chaque "value" correspond au code attendu par l'URL Primo, chaque "label" correspond au texte affiché à l'écran.
    const matchOperators = [
        { value: 'contains', label: 'contient' },
        { value: 'exact', label: 'est égal à' },
        { value: 'startswith', label: 'commence par' }
    ];
    // Liste des opérateurs booléens qui relient les lignes entre elles.
    // Important : le premier critère n'affiche pas de booléen,
    // mais les critères suivants peuvent être reliés par AND / OR / NOT.
    const boolOperators = [

        { value: 'OR', label: 'OU' },

        /* Bouton de recherche*/

    `;

    // $ est un raccourci pour éviter de répéter root.getElementById(...)
    // Dans un Shadow DOM, document.getElementById('support') ne trouve rien : le contenu du shadow root est invisible depuis le document principal. Il faut chercher à l’intérieur du shadow root, d’où root.getElementById. L’avantage du raccourci est qu’il n’y a qu’un seul endroit où root est mentionné pour ces recherches.
    // La page hôte peut charger jQuery (qui définit aussi $), mais il n'y a pas de conflit : ce $ est déclaré à l’intérieur de la fonction qui enveloppe tout le script, il est donc local et masque seulement le $ global à l’intérieur de ce bloc, sans rien casser à l’extérieur.
    const $ = (id) => root.getElementById(id);
    const form = $('primo-standalone-form');
    form.setAttribute('aria-label', label_formulaire);
    const supportSelect = $('support');
    const materialTypeSelect = $('materialType');
    const languageSelect = $('language');
    const publicationDateSelect = $('publicationDate');
	const customYearField = $('customYearField');
	const customYearsFields = $('customYearsFields');
    const startYearInput = $('startYear');
    const endYearInput = $('endYear');
    const YearInput = $('Year');
    const statusZone = $('primoFormStatus');
    const errorZone = $('primoFormError');
    const addBtn = $('addRowBtn');
    const clearBtn = $('clearBtn');

    // Tableau d'état principal du formulaire pour la partie "lignes de recherche".
    // Chaque objet du tableau représente une ligne visible à l'écran.
    // Le rendu HTML est régénéré à partir de ce tableau.
    let searchRows = [];

    // Fabrique l'objet JavaScript représentant une ligne de recherche.
    // L'index n'est pas utilisé directement ici pour construire l'objet mais il est passé pour cohérence avec l'appelant et une éventuelle évolution.
    function createSearchRow(index) {
        return {
            boolOperator: 'AND',
            field: 'any',
            match: 'contains',
            query: ''
        };
    }

    function buildSelect(items, selectedValue, label, onChange, className) {
        const select = document.createElement('select');
        if (className) select.className = className;
        select.setAttribute('aria-label', label);
        items.forEach(item => {
            const option = document.createElement('option');
            option.value = item.value;
            option.textContent = item.label;
            option.selected = selectedValue === item.value;
            select.appendChild(option);
        });
        select.addEventListener('change', (e) => onChange(e.target.value));
        return select;
    }

    function updateMatchOperators(rowIndex) {
        const rowElement = root.querySelectorAll('#searchRows .primo-search-row')[rowIndex];
        if (!rowElement) return;

        const fieldSelect = rowElement.querySelector('.primo-input-group.field select');
        const matchSelect = rowElement.querySelector('.primo-input-group.operator select');
        const startsWithOption = matchSelect.querySelector('option[value="startswith"]');

        const isTitle = fieldSelect.value === 'title';
        startsWithOption.hidden = !isTitle;

        if (!isTitle && matchSelect.value === 'startswith') {
            matchSelect.value = 'contains';
            searchRows[rowIndex].match = 'contains';
        }
    }

    function buildGroup(className, child) {
        const group = document.createElement('div');
        group.className = 'primo-input-group ' + className;
        if (child) group.appendChild(child);
        return group;
    } 

    // Au focus sur l'un des champs, les deux placeholders deviennent AAAA.
    function showYearsPlaceholders() {
        startYearInput.placeholder = 'AAAA';
        endYearInput.placeholder = 'AAAA';
    }

    // Lorsque les deux champs ont perdu le focus, rétablir les placeholders De et A si les champs sont vides.
    function resetYearsPlaceholders() {
        if (document.activeElement === startYearInput ||
            document.activeElement === endYearInput) {
            return;
        }
        if (!startYearInput.value) {
            startYearInput.placeholder = 'De';
        }
        if (!endYearInput.value) {
            endYearInput.placeholder = 'À';
        }
    }

    function announce(message) {
        statusZone.textContent = '';
        setTimeout(() => { statusZone.textContent = message; }, 100);
    }

    function clearError() {
        errorZone.textContent = '';
        errorZone.hidden = true;
        root.querySelectorAll('#searchRows input[aria-invalid]').forEach(input => {
            input.removeAttribute('aria-invalid');
            input.removeAttribute('aria-describedby');
        });
    }

    function showError(message, invalidIndexes) {
        clearError();
        const inputs = root.querySelectorAll('#searchRows input[type="text"]');
        invalidIndexes.forEach(i => {
            inputs[i].setAttribute('aria-invalid', 'true');
            inputs[i].setAttribute('aria-describedby', 'primoFormError');
        });
        errorZone.textContent = message;
        errorZone.hidden = false;
        inputs[invalidIndexes[0]].focus();
    }

    // Fonction centrale de rendu des lignes de recherche.
    // Elle vide le conteneur HTML puis reconstruit toutes les lignes à partir du tableau searchRows.
    // Cette approche garantit que l'affichage reflète toujours l'état interne.
    function renderSearchRows() {
        const container = $('searchRows');
        container.innerHTML = '';

        searchRows.forEach((row, index) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'primo-search-row';

            if (index === 0) {
                // La première ligne n'a pas d'opérateur booléen affiché.
                // On place donc un simple espace vide de même largeur
                // pour conserver l'alignement visuel avec les lignes suivantes.
                rowDiv.appendChild(buildGroup('spacer'));
            } else {
                // À partir de la deuxième ligne, on affiche le sélecteur booléen
                // qui permet de relier cette ligne à la précédente.
                // À chaque changement, on met à jour l'état interne,
                // sans rerender immédiat car le select existe déjà dans le DOM.
                rowDiv.appendChild(buildGroup('bool', buildSelect(
                    boolOperators, row.boolOperator,
                    `Opérateur booléen de la ligne ${index + 1}`,
                    (v) => { searchRows[index].boolOperator = v; },
                    'bool-operator'
                )));
            }

            // Sélecteur du champ interrogé (titre, auteur, sujet, etc.).
            rowDiv.appendChild(buildGroup('field', buildSelect(
                searchFields, row.field,
                `Champ recherché de la ligne ${index + 1}`,
                (v) => {
                    searchRows[index].field = v;
                    updateMatchOperators(index);
                }
            )));

            // Sélecteur du type de correspondance textuelle.
            // Exemple : contient / exact / commence par.
            rowDiv.appendChild(buildGroup('operator', buildSelect(
                matchOperators, row.match,
                `Type de correspondance de la ligne ${index + 1}`,
                (v) => { searchRows[index].match = v; }
            )));

            // Champ texte de la requête saisie par l'usager.
            // À chaque frappe, on synchronise l'objet correspondant dans le tableau searchRows.
            const queryInput = document.createElement('input');
            queryInput.type = 'text';
            const placeholderText = 'Saisir un terme de recherche';
            queryInput.placeholder = placeholderText;
            queryInput.setAttribute('aria-label', `${placeholderText}, ligne ${index + 1}`);
            queryInput.value = row.query;
            queryInput.addEventListener('input', (e) => {
                searchRows[index].query = e.target.value;
                if (e.target.hasAttribute('aria-invalid')) clearError();
            });
            rowDiv.appendChild(buildGroup('query', queryInput));

            container.appendChild(rowDiv);
            updateMatchOperators(index);
        });

        // On masque le bouton d'ajout à partir de 7 lignes,
        // conformément à la règle métier définie au début du fichier.
        addBtn.style.display = searchRows.length >= max_rows ? 'none' : 'flex';
    }

    // Initialise le formulaire avec une seule ligne vide.
    // Les lignes supplémentaires sont ajoutées à la demande de l'usager.
    function initializeForm() {
        searchRows = [createSearchRow(0)];
        renderSearchRows();
    }

    // Cette fonction adapte la liste des types de document au support choisi.
    // Si l'on recherche uniquement des contenus en ligne les types purement physiques (vidéos, CD, affiches) sont non sélectionnables.
    // À l'inverse, le type "articles" n'est sélectionnable que si on cherche des contenus en ligne.
    function updateMaterialTypes() {
        const support = supportSelect.value;
        const isPhysical = support === 'library' || support === 'all_libraries';

        const options = {
            videos: materialTypeSelect.querySelector('option[value="videos"]'),
            audios: materialTypeSelect.querySelector('option[value="audios"]'),
            images: materialTypeSelect.querySelector('option[value="images"]'),
            games: materialTypeSelect.querySelector('option[value="games"]'),
            articles: materialTypeSelect.querySelector('option[value="articles"]')

        };

        options.videos.disabled = !isPhysical;
        options.audios.disabled = !isPhysical;
        options.images.disabled = !isPhysical;
        options.games.disabled = !isPhysical;
        options.articles.disabled = isPhysical;
        // La mention "(en ligne uniquement)" n'est affichée que lorsque l'option "Articles" n'est pas sélectionnable
        options.articles.textContent = isPhysical ? 'Articles (en ligne uniquement)' : 'Articles';

        if (support === 'all_libraries') {
            materialTypeSelect.value = 'all_items';
            return;
        }

        // Si l'utilisateur avait sélectionné une option désormais interdite on revient à "Tous types" pour éviter de de conserver un état incohérent dans le formulaire.
        const selected = materialTypeSelect.querySelector(`option[value="${materialTypeSelect.value}"]`);
        if (selected && selected.disabled) {
            materialTypeSelect.value = 'all_items';
        }
    }

    // Retire l'option "Physique" si aucune bibliothèque n'est définie dans le code ; sinon met à jour le libellé de l'option "Physique" en y insérant le nom de la bibliothèque
    // Retire l'option "Toutes bibliothèques" si toutes_bibliotheques est false
    function updateLibrarySupport() {
        const allLibrariesOption = supportSelect.querySelector('option[value="all_libraries"]');
        const libraryOption = supportSelect.querySelector('option[value="library"]');

        if (allLibrariesOption && !toutes_bibliotheques) {
            allLibrariesOption.remove();
        }

        const libraryCode = typeof code_bibliotheque === 'string' ? code_bibliotheque.trim() : '';
        const libraryLabel = typeof label_bibliotheque === 'string' ? label_bibliotheque.trim() : '';
        const hasLibraryCode = libraryCode !== '';

        if (libraryOption) {
            if (hasLibraryCode) {
                libraryOption.textContent = `Physique (${libraryLabel || libraryCode})`;
            } else {
                // "Physique" est sélectionné par défaut dans le formulaire HTML : on bascule vers "toutes les bibliothèques" si aucune bibliothèque précise n'est définie
                libraryOption.remove();
            }
        }

        if (supportSelect.selectedIndex < 0) {
            supportSelect.selectedIndex = 0;
        }
        updateMaterialTypes();
    }


    // Ajout d'une ligne supplémentaire jusqu'à un maximum de 7.
    // Après modification du tableau d'état, on relance le rendu complet.
    addBtn.addEventListener('click', () => {
        if (searchRows.length >= max_rows) return;
        clearError();
        searchRows.push(createSearchRow(searchRows.length));
        renderSearchRows();
        const maxReached = searchRows.length >= max_rows;
        announce(`Ligne de recherche ${searchRows.length} ajoutée` + (maxReached ? `. Nombre maximum de lignes atteint (${max_rows})` : ''));
        const rows = root.querySelectorAll('#searchRows .primo-search-row');
        const lastRow = rows[rows.length - 1];
        const firstFocusable = lastRow && lastRow.querySelector('select, input');
        if (firstFocusable) firstFocusable.focus();
    });

    // Réinitialisation complète du formulaire (bouton Réinitialiser).
    // On remet :
    // - 2 lignes de recherche vides
    // - le support sur "physique"
    // - tous les filtres sur leur valeur par défaut
    clearBtn.addEventListener('click', () => {
        clearError();
        initializeForm();
        supportSelect.selectedIndex = 0;
        materialTypeSelect.value = 'all_items';
        languageSelect.value = 'all_items';
        publicationDateSelect.value = 'all_items';
        startYearInput.value = '';
        endYearInput.value = '';
        customYearsFields.hidden = true;
        startYearInput.placeholder = 'De';
        endYearInput.placeholder = 'À';
        YearInput.value = '';
        customYearField.hidden = true;
        updateLibrarySupport();
        updateMaterialTypes();
        announce('Formulaire et filtres réinitialisés');
    });

    // Quand le support change, on ajuste immédiatement les types de document disponibles et on met à jour le libellé de l'option "Physique" si nécessaire.
    supportSelect.addEventListener('change', () => {
        const previousType = materialTypeSelect.value;
        updateMaterialTypes();
        updateLibrarySupport();
        if (previousType !== 'all_items' && materialTypeSelect.value === 'all_items') {
            announce('Support modifié : le type de document est remis sur « Tous types »');
        } else {
            announce('Support modifié : types de document disponibles mis à jour');
        }
    });

    // Gestion de la soumission du formulaire.
    // Au lieu d'envoyer un formulaire HTML classique on empêche l'envoi natif pour construire manuellement l'URL Primo.
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        clearError();

        // Vérification minimale : il faut au moins un terme saisi dans une des lignes de recherche.
        if (!searchRows.some(row => row.query.trim() !== '')) {
            showError('Veuillez saisir au moins un terme de recherche.', [0]);
            return;
        }

        // Le * seul ne permet pas de rechercher tous les documents contrairement à d'autres outils
        if (searchRows.some(row => row.query.trim() === '*')) {
            const wildcardIndexes = searchRows
                .map((row, i) => row.query.trim() === '*' ? i : -1)
                .filter(i => i >= 0);
            showError("Le caractère * ne permet pas de faire une recherche générale de tous les documents. Vous ne pouvez l'utiliser qu'en troncature à la fin d'un mot.", wildcardIndexes);
            return;
        }

        const url = new URL(baseUrl);

        // Primo rattache l'opérateur booléen affiché sur une ligne à la liaison
        // avec la ligne précédente. On construit donc la requête à partir des
        // seules lignes remplies, puis on porte le booléen de la ligne suivante
        // sur la ligne courante.
        const filledRows = searchRows.filter(row => row.query.trim() !== '');
        filledRows.forEach((row, index) => {
            const boolOp = index < filledRows.length - 1
                ? filledRows[index + 1].boolOperator
                : 'AND';
            url.searchParams.append('query', `${row.field},${row.match},${row.query},${boolOp}`);
        });

        // Filtre de support.
        // - online => limitation aux ressources en ligne
        // - library => limitation à une bibliothèque physique donnée
        // - all_libraries => limitations à tous les documents physiquement disponibles dans le réseau
        const support = supportSelect.value;
        if (support === 'online') {
            url.searchParams.append('facet', 'tlevel,include,online_resources');
        } else if (support === 'library') {
            url.searchParams.append('facet', 'library,include,' + code_bibliotheque);
        } else if (support === 'all_libraries') {
            url.searchParams.append('facet', 'tlevel,include,available');
        }

        // On utilise mfacet et non pfilter prévu dans le formulaire avancé par défaut
        // pour rendre la facette visible dans la page de résultats.
        // Cas particulier : "articles" correspond en réalité à deux types Primo,
        // donc on ajoute deux paramètres mfacet distincts.
        const materialType = materialTypeSelect.value;
        if (materialType === 'articles') {
            url.searchParams.append('mfacet', 'rtype,include,articles,1');
            url.searchParams.append('mfacet', 'rtype,include,magazinearticle,1');
        } else if (materialType !== 'all_items') {
            url.searchParams.append('facet', `rtype,include,${materialType}`);
        }

        const language = languageSelect.value;
        if (language !== 'all_items') {
            // Contrairement au formulaire de recherche avancée standard on utilise facet et non pfilter afin que la facette reste visible dans l'interface de résultats Primo.
            url.searchParams.append('facet', `lang,include,${language}`);
        }

        const pubDate = publicationDateSelect.value;
        // Contrairement au formulaire de recherche avancée standard on calcule dynamiquement une plage d'années à partir de l'année courante.
        // Le format attendu par Primo est : searchcreationdate,include,annéeDébut|,|annéeFin
        // on traite d'abord le cas d'une année spécifique, d'une plage d'années, puis les autres cas
        if (pubDate === 'custom_year') {
            const Year = YearInput.value.trim();            
            // Vérification du format des années.
            if (!/^\d{4}$/.test(Year)) {
                showError(
                    'Veuillez saisir une année sur 4 chiffres.',
                    []
                );
                return;
            }
            url.searchParams.append(
                'facet',
                `searchcreationdate,include,${Year}|,|${Year}`
            );
        }
        else if (pubDate === 'custom_years') {
            const startYear = startYearInput.value.trim();
            const endYear = endYearInput.value.trim();
            // Vérification du format des années.
            if (!/^\d{4}$/.test(startYear) ||
                !/^\d{4}$/.test(endYear)) {
                showError(
                    'Veuillez saisir une année de début et une année de fin sur 4 chiffres.',
                    []
                );
                return;
            }
            // Vérification de l'ordre chronologique.
            if (Number(startYear) > Number(endYear)) {
                showError(
                    "L'année de début doit être inférieure ou égale à l'année de fin.",
                    []
                );
                return;
            }
            url.searchParams.append(
                'facet',
                `searchcreationdate,include,${startYear}|,|${endYear}`
            );
        } else if (pubDate !== 'all_items') {
            // Fonctionnement actuel pour les périodes prédéfinies.
            const currentYear = new Date().getFullYear();
            const spans = {
                current_year: 0,
                previous_year: 1,
                last_5_years: 5,
                last_10_years: 10
            };
            const startYear = currentYear - spans[pubDate];
            url.searchParams.append(
                'facet',
                `searchcreationdate,include,${startYear}|,|${currentYear}`
            );
        }


        // Ajout final des paramètres Primo communs à toutes les recherches.
        Object.entries(defaultParams).forEach(([key, value]) => {
            url.searchParams.append(key, value);
        });

        window.open(url.toString(), '_blank');
    });

    function updatePublicationDateFieldVisibility() {
        const isCustomYears = publicationDateSelect.value === 'custom_years';
        const isCustomYear = publicationDateSelect.value === 'custom_year';
        customYearsFields.hidden = !isCustomYears;
        customYearField.hidden = !isCustomYear;
    }

    function setupPublicationDateFilter() {
        publicationDateSelect.addEventListener('change', updatePublicationDateFieldVisibility);
        startYearInput.addEventListener('focus', showYearsPlaceholders);
        endYearInput.addEventListener('focus', showYearsPlaceholders);
        startYearInput.addEventListener('blur', resetYearsPlaceholders);
        endYearInput.addEventListener('blur', resetYearsPlaceholders);
    }

    // Initialisation au chargement de la page.
    // 1) on crée les deux premières lignes
    // 2) on applique la logique de compatibilité des types de documents
    // 3) on met à jour le libellé de l'option "Physique" si une bibliothèque est définie dans le code, on masque l'option "Physique" si aucune bibliothèque n'est définie dans le code
    // 4) on met à jour les champs années personnalisées
    // 5) on écoute les évenements entrainant une modification des champs années personnalisés
    initializeForm();    
    updateMaterialTypes();
    updateLibrarySupport();
    updatePublicationDateFieldVisibility();
    setupPublicationDateFilter();
})();
</script>
